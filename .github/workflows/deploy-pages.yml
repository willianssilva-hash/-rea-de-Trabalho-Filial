name: Deploy workspace to GitHub Pages

on:
  push:
    branches:
      - arena/7860cf59-rea-de-trabalho-filial
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.1
        with:
          path: .

  deploy:
    name: Publish site
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
